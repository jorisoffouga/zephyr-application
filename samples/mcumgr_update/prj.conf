# GPIO for the status LED
CONFIG_GPIO=y

# MCUmgr core
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_MAIN_STACK_SIZE=2176

# Image management (upload, test, confirm) and OS group (reset)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# Build an MCUboot compatible, signed image
CONFIG_BOOTLOADER_MCUBOOT=y

# SMP on its own UART transport, on the UART in zephyr,uart-mcumgr (board
# devicetree or boards/<board>.overlay). This UART carries only SMP frames:
# no shell, no console, no printk (MCUboot still prints its boot log, the
# host ignores it).
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
