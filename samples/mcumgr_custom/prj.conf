# LEDs, click boards (see boards/stm32f4_disco.overlay)
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_PWM=y

# MCUmgr core
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_MAIN_STACK_SIZE=2176

# "led get" answers with up to 22 LEDs (~1 KiB of CBOR): larger SMP buffers
# (UART MTU <= NETBUF_SIZE + 2). Uploads still use 128-byte chunks.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1536
CONFIG_MCUMGR_TRANSPORT_UART_MTU=1536

# Image group (upload, test, confirm), OS group (echo, reset).
# The custom groups are CONFIG_APP_*_MGMT (Kconfig, default y).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# OS group info (uname-like: kernel version, build date, board) and
# bootloader info (name, MCUboot mode)
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_INFO_BUILD_DATE_TIME=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y

# Signed image for MCUboot
CONFIG_BOOTLOADER_MCUBOOT=y

# SMP on its own UART (zephyr,uart-mcumgr = USART2, shield FT232RL): it
# carries only SMP frames. MCUboot still prints its boot log there at
# reset; SMP clients skip non-SMP lines.
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y

# Console, printk and logs on USB CDC ACM (zephyr,console = cdc_acm_log,
# Discovery micro-USB OTG). Without a host on the port the output is
# dropped, never blocking.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="mcumgr_custom log"
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_SHELL=n

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
# keep the boot messages until the USB log port is enumerated and opened
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=2500
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_DEFAULT_LEVEL=3
# app modules (main, led_ctrl, bargraph): _INF info, _DBG debug
CONFIG_APP_LOG_LEVEL_INF=y
